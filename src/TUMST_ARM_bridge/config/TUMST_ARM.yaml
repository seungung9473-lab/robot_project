servo_bridge:
  ros__parameters:
    port: /dev/servo_bus
    baud: 1000000
    rate_hz: 30.0
    action_name: arm_controller/follow_joint_trajectory
    joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    ids:
    - 1
    - 2
    - 3
    - 4
    centers:
    - 2078   # J1 영점 11/3 재측정: 원래 2047, 컵 실측(턴테이블·ID6)으로 +31 count(2.72°)
    - 4095
    - 0
    - 1990
    signs:
    - -1
    - -1
    - -1
    - -1
    min_counts:
    - 974
    - 1934
    - 0
    - 774
    max_counts:
    - 3357
    - 4095
    - 2047
    - 3159
    margin_lo:
    - 0
    - 0
    - 0
    - 0
    margin_hi:
    - 0
    - 0
    - 0
    - 0
    # J1이 + 쪽(ID5 방향)으로 갈 때 실제로 덜 도는 비율. 11/3 ID5(+35.7°)에서 1.5° 덜 돎 → 0.043
    positive_gain:
    - 0.043
    - 0.0
    - 0.0
    - 0.0
    acc: 50
    min_speed: 1
    settle_speed: 30
    max_speed: 4000
    goal_tolerance_counts: 15
    settle_timeout: 3.0
    # 50-pose encoder test: tighten bounded endpoint feedback correction; no zero/TCP offset change.
    fine_correction_iterations: 5
    fine_tolerance_counts: 1
    fine_max_counts: 4
    # J1 alone reached the old 4-count command bound in the 10-cycle test.
    fine_max_counts_per_joint: [8, 4, 4, 4]
    turntable_id: 0
    turntable_speed: 600
    read_only: false
    feedback_timeout: 1.0
    start_tolerance_counts: 8
    tracking_tolerance_counts: 16
    command_rate_hz: 50.0
esp32_bridge:
  ros__parameters:
    port: /dev/esp32
    hold_diff: -150
    grip_diff: -150   # 2026-11-09 사용자 요청: -200 → -100 → -150 (-106 약한 밀착이 들기 중 풀려 올림)
    release_diff: -50
    grip_timeout: 5.0
    release_timeout: 3.0
