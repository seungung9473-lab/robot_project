# soarm_bridge 설정 — 하드웨어 실측값 (teach & play 로 확인한 방향)
servo_bridge:
  ros__parameters:
    port: /dev/servo_bus
    baud: 1000000
    rate_hz: 30.0
    action_name: arm_controller/follow_joint_trajectory   # MoveIt controller 이름에 맞출 것
    joint_names: [joint1, joint2, joint3, joint4]          # URDF(soarm4_description) 관절 이름
    ids:        [1, 2, 3, 4]
    centers:    [2047, 4095, 0, 2047]                     # URDF 0 rad 일 때 count
    signs:      [-1, -1, -1, -1]                           # rad = sign*(count-center)*2π/4096
    min_counts: [860, 1879, 0, 660]                       # 기구 끝 (실측)
    max_counts: [3472, 4095, 2047, 3273]
    margin_lo:  [40, 10, 40, 40]                          # 끝에서 이만큼 안쪽까지만 움직임
    margin_hi:  [40, 40, 10, 40]
    acc: 30                                               # x100 count/s²
    min_speed: 50                                         # count/s
    max_speed: 1500
    goal_tolerance_counts: 25
    settle_timeout: 3.0
    turntable_id: 0                                       # STS3215 턴테이블 달면 5
    turntable_speed: 600

esp32_bridge:
  ros__parameters:
    port: /dev/esp32
    hold_diff: -400        # 이 값보다 낮으면 "잡았다"  (허공 diff 와 잡았을 때 diff 의 중간값으로)
    release_diff: -50      # 이 값보다 높아지면 "놓았다"
    grip_timeout: 2.0
